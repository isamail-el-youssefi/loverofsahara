name = "loverofsahara"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Reviews backend. These bindings are commented out until the resources exist, because Cloudflare refuses to
# deploy a binding that points at a database/bucket that isn't there. To enable reviews:
#   1. npx wrangler d1 create lover-reviews          -> paste the database_id below
#   2. npx wrangler r2 bucket create review-photos   -> enable public access, paste its URL in PHOTOS_BASE_URL
#   3. uncomment the blocks, then apply migrations/0001_reviews.sql and migrations/seed-old-reviews.sql

# [[d1_databases]]
# binding = "DB"
# database_name = "lover-reviews"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"

# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "review-photos"

# [vars]
# PHOTOS_BASE_URL = "https://REPLACE_WITH_R2_PUBLIC_URL"
